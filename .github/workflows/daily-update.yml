name: Daily Tech Update

on:
  schedule:
    # 06:00 UTC every day. (GitHub cron is always UTC.)
    - cron: "0 6 * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: automation
        run: pip install -r requirements-dev.txt

      - name: Unit tests (intelligence logic, no network)
        working-directory: automation
        run: python -m pytest -q tests

      - name: Run scraper + intelligence pipeline
        working-directory: automation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # AI gateway — OpenRouter preferred; LLM_* is the fallback / legacy tools pipeline.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_FAST_MODEL: ${{ vars.LLM_FAST_MODEL }}
          LLM_REASONING_MODEL: ${{ vars.LLM_REASONING_MODEL }}
          LLM_PREMIUM_MODEL: ${{ vars.LLM_PREMIUM_MODEL }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
          EMBEDDING_BASE_URL: ${{ vars.EMBEDDING_BASE_URL }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          INTEL_MAX_LLM_CALLS_PER_RUN: ${{ vars.INTEL_MAX_LLM_CALLS_PER_RUN }}
          LOG_FORMAT: json
          # Auto-provided by GitHub — raises the GitHub API rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scraper.py
